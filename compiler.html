<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Python Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
/* Layout: toolbar on top, editor | output side by side; stacked on narrow screens.
   The file explorer is hidden behind the folder button in the editor header. */
:root {
  --bg: #ffffff;
  --panel: #f6f7f9;
  --line: #e2e5ea;
  --fg: #1b1f24;
  --muted: #6a7280;
  --accent: #2f5fa7;
  --accent-fg: #ffffff;
  --err: #c0362c;
  --ok: #2d7a46;
  --hl: #fff4c2;
  --bp: #d9473b;
  --sel: #d7e3f6;
  --s-kw: #8b2fa8;
  --s-str: #2d7a46;
  --s-num: #b5530b;
  --s-com: #8a919c;
  --s-def: #2f5fa7;
  --s-builtin: #0f7c8c;
  --ui: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15181c; --panel: #1c2026; --line: #2c323a; --fg: #e4e7eb; --muted: #8d96a3;
    --accent: #6f9be0; --accent-fg: #0f1419; --err: #ef7a6f; --ok: #6fc28a; --hl: #3a3420;
    --bp: #ef6a5f; --sel: #2a3a55;
    --s-kw: #cf8ee6; --s-str: #8fcf9c; --s-num: #e9a46a; --s-com: #6c7480; --s-def: #8ab4f0;
    --s-builtin: #6cc7d3;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 14px/1.4 var(--ui);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
button, input { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
/* no double-tap zoom on buttons/text; pinch still allowed where the browser permits */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* icons drawn as SVG so phones never swap them for emoji */
.ic { width: .8em; height: .8em; fill: currentColor; vertical-align: -0.05em; flex: none; }
.btn .ic + span, .btn span + .ic { margin-left: .35em; }
/* iOS zooms in on any focused field under 16px - keep fields at 16px on touch screens */
@media (pointer: coarse) {
  input, textarea, select, .in-field, #shareUrl, .CodeMirror textarea { font-size: 16px !important; }
}
[hidden] { display: none !important; }

/* toolbar */
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; letter-spacing: -0.01em; margin-right: 4px; }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--line); background: var(--bg); border-radius: 6px;
  padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--panel); }
.btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.stop { background: var(--err); border-color: var(--err); color: var(--bg); font-weight: 600; }
.btn.small { font-size: 12px; padding: 3px 9px; }
.btn:disabled { opacity: .5; cursor: default; }
.status-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; text-transform: none; letter-spacing: 0; }
#status { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12px; cursor: pointer; text-decoration: underline; }

/* panes */
main {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pane + .pane { border-left: 1px solid var(--line); }
.pane-head {
  display: flex; align-items: center; gap: 8px; min-height: 38px;
  padding: 0 12px; border-bottom: 1px solid var(--line);
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
}
.pane-head .hint { text-transform: none; letter-spacing: 0; font-size: 12px; white-space: nowrap; }
.pane-head .btn { text-transform: none; letter-spacing: 0; }

/* editor header: folder button + file tabs */
.ed-head { padding-left: 6px; gap: 2px; }
.icon-btn {
  position: relative; display: inline-grid; place-items: center;
  width: 30px; height: 30px; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; flex: none;
}
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--panel); color: var(--fg); }
.icon-btn .dot { position: absolute; top: 5px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
#tabs { display: flex; min-width: 0; overflow-x: auto; scrollbar-width: none; align-self: stretch; }
#tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: none; cursor: pointer; white-space: nowrap;
  font: 13px/1 var(--mono); text-transform: none; letter-spacing: 0; color: var(--muted);
  padding: 0 10px; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--fg); }
.tab.active { color: var(--fg); border-bottom-color: var(--accent); }
.tab-input { font: 13px var(--mono); width: 12em; border: 1px solid var(--accent); border-radius: 4px; padding: 3px 6px; background: var(--bg); align-self: center; }

.ed-body { flex: 1; min-height: 0; display: flex; position: relative; }

/* explorer */
#explorer {
  width: 220px; flex: none; border-right: 1px solid var(--line); background: var(--panel);
  display: flex; flex-direction: column; min-height: 0;
}
.ex-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; }
.ex-head .title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
#fileList { list-style: none; margin: 0; padding: 0 0 8px; overflow-y: auto; flex: 1; min-height: 0; }
.file-row {
  display: flex; align-items: center; gap: 4px; padding: 0 6px 0 12px; min-height: 32px;
  cursor: pointer; font: 13px var(--mono);
}
.file-row:hover { background: color-mix(in srgb, var(--fg) 5%, transparent); }
.file-row.active { background: var(--sel); }
.file-row .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row .fsize { color: var(--muted); font: 11px var(--ui); }
.row-btn {
  border: 0; background: none; cursor: pointer; color: var(--muted); width: 26px; height: 26px; border-radius: 4px;
  font-size: 13px; line-height: 1; opacity: 0;
}
.file-row:hover .row-btn, .file-row:focus-within .row-btn, .file-row.active .row-btn { opacity: 1; }
.row-btn:hover { background: var(--bg); color: var(--fg); }
.row-btn:focus-visible { opacity: 1; outline: 2px solid var(--accent); }
.file-row input { flex: 1; min-width: 0; font: 13px var(--mono); border: 1px solid var(--accent); border-radius: 4px; padding: 3px 6px; background: var(--bg); }
.confirm { display: flex; align-items: center; gap: 6px; flex: 1; font: 12px var(--ui); }
.confirm span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-foot { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; }

#editorWrap { flex: 1; min-width: 0; min-height: 0; position: relative; }
#binView {
  position: absolute; inset: 0; z-index: 3; background: var(--bg);
  display: grid; place-content: center; text-align: center; gap: 6px; padding: 24px; color: var(--muted);
}
#binView b { color: var(--fg); font: 600 14px var(--mono); }
#binView code { font-family: var(--mono); color: var(--fg); background: var(--panel); padding: 2px 6px; border-radius: 4px; }
#dropHint {
  position: fixed; inset: 0; z-index: 40; display: grid; place-content: center;
  background: color-mix(in srgb, var(--accent) 12%, transparent); border: 3px dashed var(--accent);
  font-size: 18px; font-weight: 600; color: var(--accent); pointer-events: none;
}

/* CodeMirror theme */
.CodeMirror {
  height: 100%; background: var(--bg); color: var(--fg);
  font-family: var(--mono); font-size: 14px; line-height: 1.55;
}
.CodeMirror-gutters { background: var(--bg); border-right: 1px solid var(--line); }
.CodeMirror-linenumber { color: var(--muted); padding: 0 6px 0 4px; cursor: pointer; }
.CodeMirror-cursor { border-left: 2px solid var(--accent); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: var(--sel); }
.CodeMirror-line::selection, .CodeMirror-line > span::selection, .CodeMirror-line > span > span::selection { background: var(--sel); }
.CodeMirror-matchingbracket { color: inherit !important; outline: 1px solid var(--muted); }
.cm-s-py .cm-keyword { color: var(--s-kw); font-weight: 600; }
.cm-s-py .cm-string, .cm-s-py .cm-string-2 { color: var(--s-str); }
.cm-s-py .cm-number { color: var(--s-num); }
.cm-s-py .cm-comment { color: var(--s-com); font-style: italic; }
.cm-s-py .cm-def { color: var(--s-def); font-weight: 600; }
.cm-s-py .cm-builtin { color: var(--s-builtin); }
.cm-s-py .cm-variable-2, .cm-s-py .cm-property, .cm-s-py .cm-operator { color: var(--fg); }
.cm-s-py .cm-meta { color: var(--s-num); }
.cm-s-py .cm-error { color: var(--err); text-decoration: underline wavy; }
.bp-gutter { width: 14px; cursor: pointer; }
.bp-dot { color: var(--bp); font-size: 12px; line-height: inherit; padding-left: 3px; }
.dbg-line { background: var(--hl); }
.err-line { background: color-mix(in srgb, var(--err) 14%, transparent); }

/* output */
#outWrap { flex: 1; min-height: 0; overflow: auto; }
.term {
  margin: 0; padding: 12px;
  font-family: var(--mono); font-size: 13px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word;
}
#output { min-height: 100%; }
.term .err { color: var(--err); }
.term .in { color: var(--accent); font-weight: 600; }
.term .note { color: var(--muted); font-style: italic; font-family: var(--ui); }
.in-field {
  font: inherit; font-weight: 600; color: var(--accent);
  border: 0; border-bottom: 1px dashed var(--accent); background: transparent;
  padding: 0; margin: 0; outline: none; min-width: 6ch; width: 60%; border-radius: 0;
}
.in-field:focus { border-bottom-style: solid; }

/* debugger */
#debug { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.dbg-controls {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.dbg-controls .btn { padding: 5px 10px; font-size: 13px; }
#stepInfo { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
#scrub { width: 100%; margin: 0; accent-color: var(--accent); }
.scrub-row { padding: 6px 12px; border-bottom: 1px solid var(--line); }
.dbg-body { flex: 1; min-height: 0; overflow: auto; }
.dbg-section { border-bottom: 1px solid var(--line); }
.dbg-section:last-child { border-bottom: 0; }
.dbg-section h3 {
  margin: 0; padding: 8px 12px 4px;
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600;
}
#eventLine, #stack { padding: 0 12px 8px; font-family: var(--mono); font-size: 13px; word-break: break-word; }
#eventLine .ret { color: var(--ok); font-weight: 600; }
#eventLine .exc { color: var(--err); font-weight: 600; }
#eventLine .wait { color: var(--accent); font-weight: 600; }
.vars-scroll { overflow-x: auto; padding: 0 12px 8px; }
table.vars { border-collapse: collapse; font-family: var(--mono); font-size: 13px; width: 100%; }
table.vars td { padding: 3px 8px 3px 0; vertical-align: top; border-top: 1px solid var(--line); }
table.vars tr:first-child td { border-top: 0; }
table.vars td.name { font-weight: 600; white-space: nowrap; }
table.vars td.type { color: var(--muted); white-space: nowrap; font-size: 12px; }
table.vars td.val { word-break: break-word; }
table.vars tr.changed td.val { background: var(--hl); }
.empty { color: var(--muted); font-style: italic; font-family: var(--ui); }
#dbgOut { padding-top: 0; }

/* share sheet */
#shareSheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--bg); border-top: 1px solid var(--line);
  box-shadow: 0 -8px 24px rgba(0,0,0,.08);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 8px;
}
.share-row { display: flex; gap: 8px; }
#shareUrl {
  flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
  font-family: var(--mono); font-size: 12px; background: var(--panel);
}
#copyBtn { min-width: 5.5em; }
#shareMeta { font-size: 12px; color: var(--muted); }

#toast {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px;
  z-index: 30; pointer-events: none; max-width: calc(100% - 32px);
}

.view-tabs { display: none; }
@media (max-width: 760px) {
  .view-tabs {
    display: flex; border-bottom: 1px solid var(--line);
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  }
  .view-tab {
    flex: 1; border: 0; background: none; cursor: pointer; padding: 10px 0 9px; font-weight: 600; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px; position: relative;
  }
  .view-tab.active { color: var(--fg); border-bottom-color: var(--accent); }
  .view-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .vdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: 2px; }
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  main[data-view="code"] .out-pane, main[data-view="output"] .code-pane { display: none; }
  .pane + .pane { border-left: 0; }
  .brand, .pane-head .hint { display: none; }
  header { gap: 6px; }
  .btn { padding: 6px 10px; }
  .CodeMirror { font-size: 13px; }
  #explorer { position: absolute; inset: 0; z-index: 5; width: auto; border-right: 0; }
  .row-btn { opacity: 1; }
  .file-row { min-height: 40px; }
}
</style>
</head>
<body>

<header>
  <span class="brand">Python</span>
  <button class="btn primary" id="runBtn" title="Run (Ctrl/Cmd + Enter)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg><span>Run</span></button>
  <button class="btn" id="debugBtn" title="Step through line by line">Debug</button>
  <span class="spacer"></span>
  <button class="btn" id="shareBtn">Share</button>
  <button class="btn" id="downloadBtn" title="Download this file">Download</button>
</header>

<nav class="view-tabs" id="viewTabs" aria-label="View">
  <button class="view-tab active" id="viewCode" aria-pressed="true">Code</button>
  <button class="view-tab" id="viewOut" aria-pressed="false"><span id="viewOutLabel">Output</span><span class="vdot" id="outDot" hidden></span></button>
</nav>

<main id="main" data-view="code">
  <section class="pane code-pane">
    <div class="pane-head ed-head">
      <button class="icon-btn" id="filesBtn" aria-label="Files" aria-expanded="false" aria-controls="explorer" title="Files">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>
        <span class="dot" id="filesDot" hidden></span>
      </button>
      <div id="tabs" role="tablist" aria-label="Open files"></div>
      <span class="spacer"></span>
      <span class="hint">Click line numbers for breakpoints</span>
    </div>
    <div class="ed-body">
      <aside id="explorer" hidden aria-label="Files">
        <div class="ex-head">
          <span class="title">Files</span>
          <span class="spacer"></span>
          <button class="btn small" id="newFileBtn">New</button>
          <button class="btn small" id="uploadBtn">Upload</button>
        </div>
        <ul id="fileList"></ul>
        <div class="ex-foot">
          <button class="btn small" id="zipBtn">Download all (.zip)</button>
        </div>
        <input type="file" id="fileInput" multiple hidden>
      </aside>
      <div id="editorWrap">
        <textarea id="code"></textarea>
        <div id="binView" hidden></div>
      </div>
    </div>
  </section>

  <section class="pane out-pane">
    <div class="pane-head">
      <span id="rightTitle">Output</span>
      <span class="spacer"></span>
      <span class="status-wrap"><span id="status">Loading Python</span><button class="linkish" id="restoreBtn" hidden>Restore previous code</button></span>
      <button class="btn small" id="clearBtn">Clear</button>
      <button class="btn small" id="exitDbgBtn" hidden>Exit debugger</button>
    </div>

    <div id="outWrap"><pre class="term" id="output"><span class="note">Press Run to start</span></pre></div>

    <div id="debug" hidden>
      <div class="dbg-controls">
        <button class="btn" id="dbgRestart" title="First step" aria-label="First step"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h2.5v14H5zM19.5 4.5v15L8.5 12z"/></svg></button>
        <button class="btn" id="dbgBack" title="Step back (←)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 4.5v15L4.5 12z"/></svg><span>Back</span></button>
        <button class="btn primary" id="dbgStep" title="Step forward (→)"><span>Step</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
        <button class="btn" id="dbgCont" title="Run to next breakpoint (F8)"><span>Continue</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 4.5v15L15.5 12zM16.5 5H19v14h-2.5z"/></svg></button>
        <span id="stepInfo"></span>
      </div>
      <div class="scrub-row"><input type="range" id="scrub" min="0" max="0" value="0" aria-label="Step"></div>
      <div class="dbg-body" id="dbgBody">
        <div class="dbg-section"><h3>Next</h3><div id="eventLine"></div></div>
        <div class="dbg-section"><h3>Call stack</h3><div id="stack"></div></div>
        <div class="dbg-section"><h3>Variables</h3><div class="vars-scroll"><table class="vars" id="vars"></table></div></div>
        <div class="dbg-section"><h3>Output so far</h3><pre class="term" id="dbgOut"></pre></div>
      </div>
    </div>
  </section>
</main>

<div id="shareSheet" hidden>
  <div class="share-row">
    <input id="shareUrl" readonly aria-label="Share link">
    <button class="btn primary" id="copyBtn">Copy</button>
    <button class="btn" id="closeShareBtn">Close</button>
  </div>
  <div id="shareMeta" hidden></div>
</div>
<div id="toast" hidden></div>
<div id="dropHint" hidden>Drop files to add them</div>

<!-- Python helpers that run inside the worker -->
<script type="text/x-python" id="pySrc">
import sys, io, os, json, types, traceback, builtins, random, importlib

ROOT = '/project'
os.makedirs(ROOT, exist_ok=True)
sys.dont_write_bytecode = True

def _isuser(fn): return isinstance(fn, str) and fn.startswith(ROOT + '/')
def _rel(fn): return fn[len(ROOT) + 1:] if _isuser(fn) else fn

class _NeedInput(BaseException): pass
class _Limit(BaseException): pass

_sess = None

class _Out:
    def __init__(s, emit, kind):
        s.emit = emit; s.kind = kind
    def write(s, t):
        t = str(t)
        if t and not (_sess and _sess.waiting is not None): s.emit(s.kind, t)
        return len(t)
    def flush(s): pass
    def isatty(s): return False

class _Session:
    def __init__(s, inputs, emit):
        s.inputs = list(inputs); s.emit = emit; s.waiting = None; s.tracing = False
    def input(s, prompt=''):
        if s.waiting is not None:
            raise _NeedInput()
        prompt = str(prompt)
        if prompt:
            sys.stdout.write(prompt)
        if s.inputs:
            v = s.inputs.pop(0)
            s.emit('in', v + '\n')
            return v
        s.waiting = prompt
        s.halt()
        raise _NeedInput()
    def halt(s):
        # Make the pause impossible to swallow: if user code catches it
        # (bare except / finally), its next line raises it again.
        if s.tracing: return
        def killer(frame, event, arg):
            if event == 'line' and _isuser(frame.f_code.co_filename):
                raise _NeedInput()
            return killer
        f = sys._getframe(1)
        while f is not None:
            f.f_trace = killer; f.f_trace_lines = True
            f = f.f_back
        sys.settrace(killer)

class _Stdin:
    def __init__(s, sess): s.sess = sess
    def readline(s, *a): return s.sess.input('') + '\n'
    def read(s, *a): return s.readline()
    def isatty(s): return False
    def __iter__(s): return s
    def __next__(s): return s.readline()

import time as _time
_real_sleep = _time.sleep
_emit_now = None
def _sleep(secs):
    if _emit_now is not None: _emit_now('flush', '')
    _real_sleep(secs)
_time.sleep = _sleep

def _begin(entry, inputs, emit, seed):
    global _sess
    os.chdir(ROOT)
    if ROOT not in sys.path: sys.path.insert(0, ROOT)
    for name, mod in list(sys.modules.items()):
        if _isuser(getattr(mod, '__file__', None) or ''):
            del sys.modules[name]
    importlib.invalidate_caches()
    sys.argv = [entry]
    sess = _sess = _Session(json.loads(inputs), emit)
    builtins.input = sess.input
    sys.stdin = _Stdin(sess)
    random.seed(seed)
    return sess

def _load(entry):
    path = ROOT + '/' + entry
    with open(path, encoding='utf-8') as f:
        src = f.read()
    return compile(src, path, 'exec'), {'__name__': '__main__', '__file__': path, '__builtins__': builtins}

def _exc_info(e):
    tb = e.__traceback__
    while tb is not None and not _isuser(tb.tb_frame.f_code.co_filename):
        tb = tb.tb_next
    text = ''.join(traceback.format_exception(type(e), e, tb)).replace('File "' + ROOT + '/', 'File "')
    loc = None
    if isinstance(e, SyntaxError) and _isuser(e.filename):
        loc = [_rel(e.filename), e.lineno]
    t = tb
    while t is not None:
        if _isuser(t.tb_frame.f_code.co_filename):
            loc = [_rel(t.tb_frame.f_code.co_filename), t.tb_lineno]
        t = t.tb_next
    return text, loc

def _exit_msg(ex):
    if ex.code is None or ex.code == 0 or isinstance(ex.code, int): return None
    return str(ex.code) + '\n'

def _run(entry, inputs, emit, seed):
    global _emit_now
    _emit_now = emit
    sess = _begin(entry, inputs, emit, seed)
    o, e = sys.stdout, sys.stderr
    sys.stdout = _Out(emit, 'out'); sys.stderr = _Out(emit, 'err')
    res = {'err': None, 'loc': None, 'need': None}
    try:
        code, g = _load(entry)
        exec(code, g)
    except _NeedInput:
        pass
    except SystemExit as ex:
        res['err'] = _exit_msg(ex)
    except BaseException as ex:
        if sess.waiting is None:
            res['err'], res['loc'] = _exc_info(ex)
    finally:
        sys.settrace(None)
        sys.stdout, sys.stderr = o, e
        _emit_now = None
    if sess.waiting is not None:
        res = {'err': None, 'loc': None, 'need': sess.waiting}
    return json.dumps(res)

def _safe(v):
    if isinstance(v, types.FunctionType): return '<function %s>' % v.__name__
    if isinstance(v, type): return '<class %s>' % v.__name__
    try: r = repr(v)
    except Exception: r = '<unprintable>'
    return r if len(r) <= 160 else r[:157] + '...'

def _trace(entry, inputs, seed, limit):
    buf = io.StringIO()
    steps = []
    sess = _begin(entry, inputs, lambda k, t: buf.write(t) if sess.waiting is None else None, seed)
    sess.tracing = True
    def snap(frame):
        res = []
        for k, v in list(frame.f_locals.items()):
            if k.startswith('__') and k.endswith('__'): continue
            if isinstance(v, types.ModuleType): continue
            res.append([k, type(v).__name__, _safe(v)])
        return res
    def stack(frame):
        s = []
        f = frame
        while f is not None and _isuser(f.f_code.co_filename):
            n = f.f_code.co_name
            rel = _rel(f.f_code.co_filename)
            if n == '<module>': label = '<module>' if rel == entry else '<module %s>' % rel
            elif n.startswith('<'): label = n
            else: label = n + '()' + ('' if rel == entry else '  · ' + rel)
            s.append(label)
            f = f.f_back
        return s[::-1]
    def local(frame, event, arg):
        if sess.waiting is not None:
            if event == 'line': raise _NeedInput()
            return local
        if event == 'exception' and issubclass(arg[0], (_NeedInput, _Limit)):
            return local
        if event in ('line', 'return', 'exception'):
            if len(steps) >= limit: raise _Limit()
            st = {'f': _rel(frame.f_code.co_filename), 'l': frame.f_lineno, 'ev': event,
                  'stack': stack(frame), 'vars': snap(frame), 'o': buf.tell()}
            if event == 'return': st['ret'] = _safe(arg)
            if event == 'exception': st['exc'] = arg[0].__name__ + ': ' + _safe(arg[1])[:120]
            steps.append(st)
        return local
    def glob(frame, event, arg):
        return local if _isuser(frame.f_code.co_filename) else None
    o, e = sys.stdout, sys.stderr
    sys.stdout = sys.stderr = buf
    err = None; loc = None; limited = False
    try:
        code, g = _load(entry)
        sys.settrace(glob)
        exec(code, g)
    except _NeedInput:
        pass
    except _Limit:
        limited = True
    except SystemExit as ex:
        err = _exit_msg(ex)
    except BaseException as ex:
        if sess.waiting is None:
            err, loc = _exc_info(ex)
    finally:
        sys.settrace(None)
        sys.stdout, sys.stderr = o, e
    need = sess.waiting
    if need is not None: err = None; loc = None
    return json.dumps({'steps': steps, 'out': buf.getvalue(), 'err': err, 'loc': loc,
                       'limited': limited, 'need': need})

<!-- Web worker: loads Pyodide and runs code off the main thread -->
<script type="text/x-worker" id="workerSrc">
let py, runFn, traceFn, buf = [], winStart = 0, winCount = 0;
const ROOT = '/project';
// Output is sent to the page right away, but batched when a program prints very fast.
function flush() { if (buf.length) { postMessage({ t: 'out', chunks: buf }); buf = []; } }
function emit(kind, text) {
  if (kind === 'flush') { flush(); return; }
  buf.push([kind, text]);
  const now = performance.now();
  if (now - winStart > 50) { winStart = now; winCount = 0; }
  if (++winCount <= 20 || buf.length > 500) flush();
}
function rmrf(dir) {
  for (const n of py.FS.readdir(dir)) {
    if (n === '.' || n === '..') continue;
    const p = dir + '/' + n;
    if (py.FS.isDir(py.FS.stat(p).mode)) { rmrf(p); py.FS.rmdir(p); } else py.FS.unlink(p);
  }
}
function writeFiles(files) {
  rmrf(ROOT);
  for (const f of files) {
    const parts = f.name.split('/');
    let d = ROOT;
    for (const s of parts.slice(0, -1)) { d += '/' + s; try { py.FS.mkdir(d); } catch (e) {} }
    py.FS.writeFile(ROOT + '/' + f.name, f.data);
  }
}
function readAll(dir = ROOT, pre = '', out = []) {
  for (const n of py.FS.readdir(dir)) {
    if (n === '.' || n === '..' || n === '__pycache__') continue;
    const p = dir + '/' + n;
    if (py.FS.isDir(py.FS.stat(p).mode)) readAll(p, pre + n + '/', out);
    else out.push({ name: pre + n, data: py.FS.readFile(p) });
  }
  return out;
}
function changedFiles(sent) {
  const before = new Map(sent.map(f => [f.name, f.data]));
  const res = [];
  for (const f of readAll()) {
    if (f.data.length > 5e6) continue;
    const old = before.get(f.name);
    if (old && old.length === f.data.length && old.every((b, i) => b === f.data[i])) continue;
    res.push(f);
  }
  return res;
}
async function packages(files) {
  const src = files.filter(f => f.name.endsWith('.py')).map(f => new TextDecoder().decode(f.data)).join('\n');
  try {
    await py.loadPackagesFromImports(src, {
      messageCallback: m => { if (/^Loading/.test(m)) postMessage({ t: 'status', msg: m }); },
      errorCallback: () => {}
    });
  } catch (e) {}
}
self.onmessage = async (e) => {
  const m = e.data;
  if (m.t === 'init') {
    try {
      importScripts(m.base + 'pyodide.js');
      py = await loadPyodide({ indexURL: m.base });
      py.runPython(m.py);
      runFn = py.globals.get('_run'); traceFn = py.globals.get('_trace');
      postMessage({ t: 'ready', version: py.runPython('import sys; sys.version.split()[0]') });
    } catch (err) { postMessage({ t: 'fatal', msg: String(err) }); }
    return;
  }
  if (m.t === 'run' || m.t === 'trace') {
    await packages(m.files);
    writeFiles(m.files);
    postMessage({ t: 'started', id: m.id });
    winStart = 0; winCount = 0;
    if (m.t === 'run') {
      let res;
      try { res = JSON.parse(runFn(m.entry, JSON.stringify(m.inputs), emit, m.seed)); }
      catch (err) { res = { err: String(err), loc: null, need: null }; }
      flush();
      let changed = [];
      try { if (res.need == null) changed = changedFiles(m.files); } catch (err) {}
      postMessage({ t: 'done', id: m.id, res, changed });
    } else {
      let res;
      try { res = JSON.parse(traceFn(m.entry, JSON.stringify(m.inputs), m.seed, m.limit)); }
      catch (err) { res = { steps: [], out: '', err: String(err), loc: null, limited: false, need: null }; }
      postMessage({ t: 'traced', id: m.id, res });
    }
  }
};

e(n - i - 1):\n            if arr[j] > arr[j + 1]:\n                arr[j], arr[j + 1] = arr[j + 1], arr[j]\n    return arr\n\n\ndef selection_sort(arr):\n    for i in range(len(arr)):\n        min_idx = i\n        for j in range(i + 1, len(arr)):\n            if arr[j] < arr[min_idx]:\n                min_idx = j\n        arr[i], arr[min_idx] = arr[min_idx], arr[i]\n    return arr\n\n\ndef insertion_sort(arr):\n    for i in range(1, len(arr)):\n        key = arr[i]\n        j = i - 1\n        while j >= 0 and arr[j] > key:\n            arr[j + 1] = arr[j]\n            j -= 1\n        arr[j + 1] = key\n    return arr\n\n\ndef merge_sort(arr):\n    if len(arr) <= 1:\n        return arr\n    mid = len(arr) // 2\n    left = merge_sort(arr[:mid])\n    right = merge_sort(arr[mid:])\n    result = []\n    i = j = 0\n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]:\n            result.append(left[i])\n            i += 1\n        else:\n            result.append(right[j])\n            j += 1\n    result.extend(left[i:])\n    result.extend(right[j:])\n    return result\n\n\ndef quick_sort(arr):\n    if len(arr) <= 1:\n        return arr\n    pivot = arr[len(arr) // 2]\n    left = [x for x in arr if x < pivot]\n    middle = [x for x in arr if x == pivot]\n    right = [x for x in arr if x > pivot]\n    return quick_sort(left) + middle + quick_sort(right)\n\n\ndef linear_search(arr, target):\n    for i, value in enumerate(arr):\n        if value == target:\n            return i\n    return -1\n\n\nnumbers = [38, 27, 43, 3, 9, 82, 10]\nprint(\"Bubble:\", bubble_sort(numbers.copy()))\nprint(\"Selection:\", selection_sort(numbers.copy()))\nprint(\"Insertion:\", insertion_sort(numbers.copy()))\nprint(\"Merge:\", merge_sort(numbers))\nprint(\"Quick:\", quick_sort(numbers))\nprint(\"Index of 43:\", linear_search(numbers, 43))\n\nfrom collections import deque, defaultdict\n\ngraph = {\n    \"A\": [\"B\", \"C\"],\n    \"B\": [\"A\", \"D\", \"E\"],\n    \"C\": v = None\n        current = self.head\n        while current:\n            nxt = current.next\n            current.next = prev\n            prev = current\n            current = nxt\n        self.head = prev\n\n    def __iter__(self):\n        current = self.head\n        while current:\n            yield current.data\n            current = current.next\n\n\nll = LinkedList()\nfor x in [1, 2, 3, 4]:\n    ll.append(x)\nll.reverse()\nprint(list(ll))\n\nimport math\nimport time\nimport datetime\nimport string\nimport itertools\nimport functools\n\nprint(math.sqrt(16), math.pi, math.floor(3.7), math.ceil(3.2))\nprint(math.factorial(5), math.gcd(12, 18), math.log(100, 10))\nprint(round(3.14159, 2), abs(-5), pow(2, 10), max(3, 7, 1), min([4, 2, 8]))\n\nnow = datetime.datetime.now()\nprint(\"Current time:\", now.strftime(\"%Y-%m-%d %H:%M:%S\"))\nbirthday = datetime.date(2000, 5, 17)\ntoday = datetime.date.today()\nage = today.year - birthday.year - ((today.month, today.day) < (birthday.month, birthday.day))\nprint(\"Age:\", age)\nprint(\"In 30 days:\", today + datetime.timedelta(days=30))\n\nprint(string.ascii_lowercase, string.digits, string.punctuation)\nprint(list(itertools.permutations([1, 2, 3])))\nprint(list(itertools.combinations(\"ABCD\", 2)))\nprint(list(itertools.product([0, 1], repeat=3)))\n\n\n@functools.lru_cache(maxsize=None)\ndef fib(n):\n    return n if n < 2 else fib(n - 1) + fib(n - 2)\n\n\nstart = time.time()\nprint(fib(80))\nprint(f\"Took {time.time() - start:.4f} seconds\")\n\n\ndef timer(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        start = time.perf_counter()\n        result = func(*args, **kwargs)\n        end = time.perf_counter()\n        print(f\"{func.__name__} took {end - start:.6f}s\")\n        return result\n    return wrapper\n\n\n@timer\ndef slow_sum(n):\n    return sum(i * i for i in range(n))\n\n\nprint(slow_sum(100000))\n\n# Student grade manager\nstudents = {}\n\ndef add_student():\n    name = input(\"Student name: \").strip().title()\n    if name in students:\n        print(f\"{name} already exists.\")\n        return\n    students[name] = []\n    print(f\"Added {name}.\")\n\ndef add_grade():\n    name = input(\"Student name: \").strip().title()\n    if name not in students:\n        print(\"Student not found.\")\n        return\n    try:\n        grade = float(input(\"Grade: \"))\n    except ValueError:\n        print(\"Please enter a valid number.\")\n        return\n    students[name].append(grade)\n\ndef show_report():\n    if not students:\n        print(\"No students yet.\")\n        return\n    print(\"-\" * 30)\n    for name, grades in students.items():\n        if grades:\n            avg = sum(grades) / len(grades)\n            print(f\"{name:<15} {avg:6.2f}  {grades}\")\n        else:\n            print(f\"{name:<15}  no grades\")\n    print(\"-\" * 30)\n\nmenu = {\n    \"1\": (\"Add student\", add_student),\n    \"2\": (\"Add grade\", add_grade),\n    \"3\": (\"Show report\", show_report),\n}\n\nwhile True:\n    print(\"\\nMenu:\")\n    for key, (label, _) in menu.items():\n        print(f\"  {key}. {label}\")\n    print(\"  q. Quit\")\n    choice = input(\"Choose an option: \").strip().lower()\n    if choice == \"q\":\n        print(\"Goodbye!\")\n        break\n    elif choice in menu:\n        menu[choice][1]()\n    else:\n        print(\"Invalid option, try again.\")\n\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\narr = np.array([1, 2, 3, 4, 5])\nprint(arr * 2, arr.mean(), arr.std(), arr.sum())\nmatrix = np.zeros((3, 3))\nidentity = np.eye(3)\nrandom_matrix = np.random.rand(3, 3)\nprint(np.dot(identity, random_matrix).shape)\nx = np.linspace(0, 2 * np.pi, 100)\ny = np.sin(x)\n\ndf = pd.DataFrame({\n    \"name\": [\"Alice\", \"Bob\", \"Charlie\", \"David\"],\n    \"age\": [25, 32, 18, 47],\n    \"city\": [\"London\", \"Paris\", \"London\", \"Berlin\"],\n    \"score\": [88.5, 92.1, 79.3, 85.0],\n})\nprint(df.head())\nprint(df.describe())\nprint(df[df[\"age\"] > 20])\nprint(df.groupby(\"city\")[\"score\"].mean())\ndf[\"passed\"] = df[\"score\"] >= 80\ndf = df.sort_values(by=\"score\", ascending=False)\nprint(df.to_string(index=False))\n\nplt.plot(x, y, label=\"sin(x)\")\nplt.xlabel(\"x\")\nplt.ylabel(\"y\")\nplt.title(\"Sine wave\")\nplt.legend()\nplt.grid(True)\nplt.show()\n\nclass Animal:\n    def __init__(self, name, sound=\"...\"):\n        self.name = name\n        self.sound = sound\n\n    def speak(self):\n        return f\"{self.name} says {self.sound}\"\n\n\nclass Dog(Animal):\n    def __init__(self, name, breed):\n        super().__init__(name, \"Woof\")\n        self.breed = breed\n\n    def fetch(self):\n        return f\"{self.name} the {self.breed} fetches the ball!\"\n\n\nclass Cat(Animal):\n    def __init__(self, name):\n        super().__init__(name, \"Meow\")\n\n    def speak(self):\n        return super().speak() + \" (and ignores you)\"\n\n\npets = [Dog(\"Rex\", \"Labrador\"), Cat(\"Whiskers\"), Animal(\"Generic\")]\nfor pet in pets:\n    print(pet.speak())\n    if isinstance(pet, Dog):\n        print(pet.fetch())\n\n\nclass Temperature:\n    def __init__(self, celsius=0.0):\n        self._celsius = celsius\n\n    @property\n    def celsius(self):\n        return self._celsius\n\n    @celsius.setter\n    def celsius(self, value):\n        if value < -273.15:\n            raise ValueError(\"Temperature below absolute zero!\")\n        self._celsius = value\n\n    @property\n    def fahrenheit(self):\n        return self._celsius * 9 / 5 + 32\n\n    @classmethod\n    def from_fahrenheit(cls, f):\n        return cls((f - 32) * 5 / 9)\n\n    @staticmethod\n    def is_freezing(celsius):\n        return celsius <= 0\n\n\nt = Temperature.from_fahrenheit(212)\nprint(t.celsius, t.fahrenheit, Temperature.is_freezing(t.celsius))\n\n\nclass Vector:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __add__(self, other):\n        return Vector(self.x + other.x, self.y + other.y)\n\n    def __mul__(self, scalar):\n        return Vector(self.x * scalar, self.y * scalar)\n\n    def __eq__(self, other):\n        return self.x == other.x and self.y == other.y\n\n    def __abs__(self):\n        return (self.x ** 2 + self.y ** 2) ** 0.5\n\n    def __repr__(self):\n        return f\"Vector({self.x}, {self.y})\"\n\n\nv = Vector(3, 4) + Vector(1, 2) * 2\nprint(v, abs(Vector(3, 4)))\n\n# Hangman\nimport random\n\nwords = [\"python\", \"programming\", \"computer\", \"keyboard\", \"developer\", \"function\"]\nword = random.choice(words)\nguessed = set()\nlives = 6\n\nwhile lives > 0:\n    display = \" \".join(letter if letter in guessed else \"_\" for letter in word)\n    print(f\"\\n{display}   lives: {lives}\")\n    if \"_\" not in display:\n        print(\"You won! The word was\", word)\n        break\n    guess = input(\"Guess a letter: \").lower()\n    if len(guess) != 1 or not guess.isalpha():\n        print(\"Please enter a single letter.\")\n        continue\n    if guess in guessed:\n        print(\"You already guessed that letter.\")\n        continue\n    guessed.add(guess)\n    if guess not in word:\n        lives -= 1\n        print(f\"Wrong! {guess} is not in the word.\")\nelse:\n    print(f\"Game over! The word was {word}.\")\n\n\n# Tic tac toe board\nboard = [[\" \" for _ in range(3)] for _ in range(3)]\n\ndef print_board(board):\n    for row in board:\n        print(\" | \".join(row))\n        print(\"-\" * 9)\n\ndef check_winner(board, player):\n    for i in range(3):\n        if all(board[i][j] == player for j in range(3)):\n            return True\n        if all(board[j][i] == player for j in range(3)):\n            return True\n    if all(board[i][i] == player for i in range(3)):\n        return True\n    if all(board[i][2 - i] == player for i in range(3)):\n        return True\n    return False\n\ncurrent = \"X\"\nfor turn in range(9):\n    print_board(board)\n    row, col = map(int, input(f\"Player {current}, enter row and column (0-2): \").split())\n    if board[row][col] != \" \":\n        print(\"That spot is taken!\")\n        continue\n    board[row][col] = current\n    if check_winner(board, current):\n        print_board(board)\n        print(f\"Player {current} wins!\")\n        break\n    current = \"O\" if current == \"X\" else \"X\"\nelse:\n    print(\"It's a draw!\")\n\n# list, dict and set comprehensions, generators, and common idioms\nsquares = [x ** 2 for x in range(10)]\nevens = [x for x in range(20) if x % 2 == 0]\npairs = [(x, y) for x in range(3) for y in range(3) if x != y]\nsquare_map = {x: x * x for x in range(5)}\nunique_lengths = {len(word) for word in [\"apple\", \"kiwi\", \"banana\", \"fig\"]}\nflattened = [item for sublist in [[1, 2], [3, 4], [5]] for item in sublist]\nprint(squares, evens, pairs, square_map, unique_lengths, flattened)\n\ndef countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n\nfor number in countdown(5):\n    print(number, end=\" \")\nprint()\n\ngen = (x * x for x in range(1000000))\nprint(sum(gen))\n\nnames = [\"alice\", \"bob\", \"carol\"]\nages = [30, 25, 35]\nfor name, age in zip(names, ages):\n    print(f\"{name.title()} is {age} years old\")\npeople = dict(zip(names, ages))\noldest = max(people, key=people.get)\nprint(sorted(people.items(), key=lambda item: item[1], reverse=True))\nprint(list(map(str.upper, names)))\nprint(list(filter(lambda a: a > 26, ages)))\nprint(any(age > 33 for age in ages), all(age > 18 for age in ages))\nfirst, *rest = [1, 2, 3, 4]\na, b = b, a = 1, 2\ntext = \"the quick brown fox jumps over the lazy dog\"\nword_counts = {}\nfor word in text.split():\n    word_counts[word] = word_counts.get(word, 0) + 1\nprint(word_counts)\nprint(\", \".join(sorted(set(text.replace(\" \", \"\")))))\nprint(text.title(), text.upper(), text.count(\"o\"), text.find(\"fox\"), text.replace(\"lazy\", \"sleepy\"))\nprint(text[:9], text[-3:], text[::2], len(text))\nprint(\"%s is %d years old\" % (\"Tom\", 42))\nprint(\"{} + {} = {}\".format(2, 3, 2 + 3))\nvalue = 1234567.891\nprint(f\"{value:,.2f} {value:e} {42:05d} {0.25:.0%} {'left':<10}|{'right':>10}|{'mid':^10}|\")\nmatrix = [[1, 2, 3], [4, 5, 6]]\nfor row in matrix:\n    for cell in row:\n        print(cell, end=\"\\t\")\n    print()\n\nimport asyncio\n\n\nasync def fetch_data(name, delay):\n    print(f\"Fetching {name}...\")\n    await asyncio.sleep(delay)\n    print(f\"Done fetching {name}\")\n    return {\"name\": name, \"delay\": delay}\n\n\nasync def main():\n    tasks = [fetch_data(\"users\", 1), fetch_data(\"posts\", 2), fetch_data(\"comments\", 0.5)]\n    results = await asyncio.gather(*tasks)\n    for result in results:\n        print(result)\n\n\nasyncio.run(main())\n\n\nclass InsufficientFundsError(Exception):\n    def __init__(self, balance, amount):\n        super().__init__(f\"Cannot withdraw {amount}; balance is only {balance}\")\n        self.balance = balance\n        self.amount = amount\n\n\ndef withdraw(balance, amount):\n    if amount > balance:\n        raise InsufficientFundsError(balance, amount)\n    return balance - amount\n\n\ntry:\n    withdraw(100, 250)\nexcept InsufficientFundsError as e:\n    print(\"Error:\", e)\nexcept (TypeError, ValueError) as e:\n    print(\"Bad input:\", e)\nelse:\n    print(\"Withdrawal succeeded\")\nfinally:\n    print(\"Transaction complete\")\n\n\ndef safe_divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        print(\"Cannot divide by zero!\")\n        return None\n\n\nprint(safe_divide(10, 2), safe_divide(1, 0))\n\nwhile True:\n    try:\n        number = int(input(\"Enter a positive integer: \"))\n        if number <= 0:\n            raise ValueError(\"Number must be positive\")\n        break\n    except ValueError as err:\n        print(f\"Invalid: {err}\")\nprint(f\"You entered {number}\")\n\ndef is_leap_year(year):\n    return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)\n\n\ndef bmi(weight_kg, height_m):\n    return weight_kg / height_m ** 2\n\n\ndef compound_interest(principal, rate, years, n=12):\n    return principal * (1 + rate / n) ** (n * years)\n\n\ndef convert_seconds(seconds):\n    hours, remainder = divmod(seconds, 3600)\n    minutes, secs = divmod(remainder, 60)\n    return f\"{hours:02d}:{minutes:02d}:{secs:02d}\"\n\n\ndef multiplication_table(n, up_to=10):\n    for i in range(1, up_to + 1):\n        print(f\"{n} x {i} = {n * i}\")\n\n\ndef print_pattern(rows):\n    for i in range(1, rows + 1):\n        print(\" \" * (rows - i) + \"*\" * (2 * i - 1))\n\n\ndef decimal_to_binary(n):\n    if n == 0:\n        return \"0\"\n    bits = \"\"\n    while n > 0:\n        bits = str(n % 2) + bits\n        n //= 2\n    return bits\n\n\ndef caesar_cipher(text, shift):\n    result = \"\"\n    for char in text:\n        if char.isalpha():\n            base = ord(\"A\") if char.isupper() else ord(\"a\")\n            result += chr((ord(char) - base + shift) % 26 + base)\n        else:\n            result += char\n    return result\n\n\ndef find_duplicates(items):\n    seen = set()\n    duplicates = set()\n    for item in items:\n        if item in seen:\n            duplicates.add(item)\n        seen.add(item)\n    return list(duplicates)\n\n\ndef second_largest(numbers):\n    unique = sorted(set(numbers))\n    return unique[-2] if len(unique) >= 2 else None\n\n\nyear = int(input(\"Enter a year: \"))\nif is_leap_year(year):\n    print(f\"{year} is a leap year\")\nelse:\n    print(f\"{year} is not a leap year\")\n\nprint(f\"BMI: {bmi(70, 1.75):.1f}\")\nprint(f\"${compound_interest(1000, 0.05, 10):,.2f}\")\nprint(convert_seconds(3725))\nmultiplication_table(7)\nprint_pattern(5)\nprint(decimal_to_binary(42), bin(42), int(\"101010\", 2), hex(255))\nencrypted = caesar_cipher(\"Hello, World!\", 3)\nprint(encrypted, caesar_cipher(encrypted, -3))\nprint(find_duplicates([1, 2, 3, 2, 4, 1]))\nprint(second_largest([10, 20, 4, 45, 99, 99]))\n\nimport sys\nfrom typing import Dict, List, Tuple\n\n\nMatrix = List[List[int]]\n\n\ndef read_matrix(rows: int, cols: int) -> Matrix:\n    return [[int(x) for x in input().split()][:cols] for _ in range(rows)]\n\n\ndef multiply(a: Matrix, b: Matrix) -> Matrix:\n    n, m, p = len(a), len(b), len(b[0])\n    result = [[0] * p for _ in range(n)]\n    for i in range(n):\n        for j in range(p):\n            for k in range(m):\n                result[i][j] += a[i][k] * b[k][j]\n    return result\n\n\ndef transpose(m: Matrix) -> Matrix:\n    return [list(row) for row in zip(*m)]\n\n\ndef two_sum(nums: List[int], target: int) -> Tuple[int, int]:\n    seen: Dict[int, int] = {}\n    for i, num in enumerate(nums):\n        complement = target - num\n        if complement in seen:\n            return seen[complement], i\n        seen[num] = i\n    return -1, -1\n\n\ndef max_subarray(nums: List[int]) -> int:\n    best = current = nums[0]\n    for num in nums[1:]:\n        current = max(num, current + num)\n        best = max(best, current)\n    return best\n\n\ndef valid_parentheses(s: str) -> bool:\n    stack = []\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    for ch in s:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n    return not stack\n\n\ndef main() -> None:\n    a = [[1, 2], [3, 4]]\n    b = [[5, 6], [7, 8]]\n    print(multiply(a, b))\n    print(transpose(a))\n    print(two_sum([2, 7, 11, 15], 9))\n    print(max_subarray([-2, 1, -3, 4, -1, 2, 1, -5, 4]))\n    print(valid_parentheses(\"({[]})\"), valid_parentheses(\"(]\"))\n    n = int(sys.stdin.readline())\n    values = list(map(int, sys.stdin.readline().split()))\n    print(sum(values[:n]))\n\n\nif __name__ == \"__main__\":\n    main()\n\nimport turtle\nimport tkinter as tk\nfrom tkinter import messagebox\n\ndef draw_square(t, size):\n    for _ in range(4):\n        t.forward(size)\n        t.right(90)\n\nwindo <script>
(() => {
const $ = id => document.getElementById(id);
const PYODIDE_BASE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const STEP_LIMIT = 5000;
const PROJECT_KEY = 'pyplay.project', BACKUP_KEY = 'pyplay.backup', OLD_DRAFT_KEY = 'pyplay.draft', EXPLORER_KEY = 'pyplay.explorer';
const utf8 = new TextEncoder();

const SAMPLE = `# Edit and press Run
# Click line numbers for breakpoints, then Debug

def fib(n):
    a, b = 0, 1
    seq = []
    for _ in range(n):
        seq.append(a)
        a, b = b, a + b
    return seq

nums = fib(10)
print("First 10 Fibonacci numbers:", nums)
print(f"Their sum is {sum(nums)}")

name = input("What's your name? ")
print(f"Hi, {name}!")
`;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
let toastT;
function toast(msg) { if (!$('shareSheet').hidden) return; const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
function status(msg) { $('status').textContent = msg; }
const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

// ---------------- Code / Output tabs (narrow screens) ----------------
const narrow = matchMedia('(max-width: 760px)');
function showView(v) {
  $('main').dataset.view = v;
  $('viewCode').classList.toggle('active', v === 'code'); $('viewCode').setAttribute('aria-pressed', v === 'code');
  $('viewOut').classList.toggle('active', v === 'output'); $('viewOut').setAttribute('aria-pressed', v === 'output');
  if (v === 'output') $('outDot').hidden = true;
  else setTimeout(() => {
    editor.refresh();
    const m = dbgMark || errMark;
    if (m && editor.getDoc() === m.doc) editor.scrollIntoView({ line: m.line, ch: 0 }, 80);
  }, 0);
}
function noteOutput() { if (narrow.matches && $('main').dataset.view === 'code') $('outDot').hidden = false; }
$('viewCode').onclick = () => showView('code');
$('viewOut').onclick = () => showView('output');
narrow.addEventListener('change', () => setTimeout(() => editor.refresh(), 0));

// ---------------- editor ----------------
const editor = CodeMirror.fromTextArea($('code'), {
  mode: 'python', theme: 'py', lineNumbers: true, indentUnit: 4, tabSize: 4,
  matchBrackets: true, autoCloseBrackets: true, lineWrapping: true,
  gutters: ['bp-gutter', 'CodeMirror-linenumbers'],
  extraKeys: {
    Tab: cm => cm.somethingSelected() ? cm.indentSelection('add') : cm.replaceSelection('    ', 'end'),
    'Shift-Tab': cm => cm.indentSelection('subtract'),
    'Ctrl-S': () => download(), 'Cmd-S': () => download()
  }
});
editor.on('gutterClick', (cm, line) => {
  const info = cm.lineInfo(line);
  if (info.gutterMarkers && info.gutterMarkers['bp-gutter']) cm.setGutterMarker(line, 'bp-gutter', null);
  else { const m = document.createElement('div'); m.className = 'bp-dot'; m.textContent = '●'; cm.setGutterMarker(line, 'bp-gutter', m); }
});

// ---------------- project (files) ----------------
// Each file: { name, doc: CodeMirror.Doc } for text, or { name, bin: Uint8Array } for binary files.
let files = [], active = null;
const modeFor = name => /\.pyw?$/i.test(name) ? 'python' : 'text/plain';
const fileBy = name => files.find(f => f.name === name);
const bytesOf = f => f.bin || utf8.encode(f.doc.getValue());
const sizeOf = f => f.bin ? f.bin.length : utf8.encode(f.doc.getValue()).length;
function makeFile(name, content) {
  if (typeof content !== 'string') { const t = textOrNull(content); if (t !== null) content = t; }
  return typeof content === 'string'
    ? { name, doc: CodeMirror.Doc(content, modeFor(name)) }
    : { name, bin: content };
}
function setProject(list, open) {
  files = list.length ? list : [makeFile('main.py', '')];
  active = null;
  openFile(open && fileBy(open) ? open : (fileBy('main.py') ? 'main.py' : files[0].name));
  save();
}
function snapshot() { return files.map(f => ({ name: f.name, data: bytesOf(f) })); }

function openFile(name) {
  const f = fileBy(name);
  if (!f) return;
  active = name;
  if (f.doc) {
    if (editor.getDoc() !== f.doc) editor.swapDoc(f.doc);
    $('binView').hidden = true;
  } else {
    $('binView').hidden = false;
    $('binView').innerHTML = '';
    const b = document.createElement('b'); b.textContent = f.name;
    const d = document.createElement('div'); d.textContent = `Binary file, ${fmtSize(f.bin.length)}`;
    const r = document.createElement('div'); r.append('Read with ');
    const c = document.createElement('code'); c.textContent = `open(${JSON.stringify(f.name)}, "rb")`;
    r.append(c);
    $('binView').append(b, d, r);
  }
  renderFiles();
  saveSoon();
}
function cleanName(name) {
  name = String(name).trim().replace(/\\/g, '/').replace(/^\/+/, '');
  if (!name || name.length > 200 || /\0/.test(name) || name.split('/').some(s => !s || s === '.' || s === '..')) return null;
  return name;
}
function validName(name, except) {
  if (!String(name).trim()) return [null, 'Name required'];
  const n = cleanName(name);
  if (!n) return [null, 'Invalid file name'];
  if (n !== except && fileBy(n)) return [null, `${n} already exists`];
  return [n, null];
}
function uniqueName(base) {
  if (!fileBy(base)) return base;
  const m = base.match(/^(.*?)(\.[^.\/]*)?$/);
  for (let i = 1; ; i++) { const n = `${m[1]}${i}${m[2] || ''}`; if (!fileBy(n)) return n; }
}
function guardDebug() { if (dbg) { toast('Exit the debugger first'); return true; } return false; }

function newFile() {
  if (guardDebug()) return;
  const name = uniqueName('untitled.py');
  files.push(makeFile(name, ''));
  setExplorer(true);
  openFile(name);
  startRename(name, true);
}
function renameFile(oldName, newName) {
  const f = fileBy(oldName);
  f.name = newName;
  if (f.doc && f.doc.getMode().name !== (modeFor(newName) === 'python' ? 'python' : 'null')) {
    const fresh = CodeMirror.Doc(f.doc.getValue(), modeFor(newName));
    const wasActive = editor.getDoc() === f.doc;
    f.doc = fresh;
    if (wasActive) editor.swapDoc(fresh);
  }
  if (active === oldName) active = newName;
  renderFiles(); save();
}
function deleteFile(name) {
  if (files.length === 1) { toast('Can\'t delete the last file'); return; }
  const i = files.findIndex(f => f.name === name);
  files.splice(i, 1);
  if (active === name) openFile(files[Math.max(0, i - 1)].name);
  else renderFiles();
  save();
}
async function addUploads(list) {
  if (guardDebug() || !list.length) return;
  let last = null, replaced = 0;
  for (const file of list) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const name = cleanName(file.name) || uniqueName('upload');
    const existing = fileBy(name);
    const nf = makeFile(name, bytes);
    if (existing) { delete existing.doc; delete existing.bin; Object.assign(existing, nf); replaced++; }
    else files.push(nf);
    last = name;
  }
  setExplorer(true);
  openFile(last);
  save();
  toast(list.length === 1 ? (replaced ? `Replaced ${last}` : `Added ${last}`) : `Added ${list.length} files`);
}

// rename UI (in explorer row or tab)
function startRename(name, isNew) {
  setExplorer(true);
  const row = [...$('fileList').children].find(li => li.dataset.name === name);
  if (!row) return;
  row.innerHTML = '';
  const input = document.createElement('input');
  input.id = 'renameInput'; input.value = name; input.spellcheck = false;
  input.setAttribute('autocapitalize', 'off'); input.setAttribute('aria-label', 'File name');
  row.appendChild(input);
  input.focus();
  const dot = name.lastIndexOf('.');
  input.setSelectionRange(0, dot > 0 ? dot : name.length);
  let done = false;
  const finish = commit => {
    if (done) return; done = true;
    if (commit) {
      const [ok, err] = validName(input.value, name);
      if (!ok) { toast(err); done = false; input.focus(); return; }
      if (ok !== name) { renameFile(name, ok); return; }

    renderFiles();

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }

function confirmDelete(name) {
  if (guardDebug()) return;
  const row = [...$('fileList').children].find(li => li.dataset.name === name);
  row.innerHTML = '';
  const box = document.createElement('div'); box.className = 'confirm';

  status('Loading Python');

  let resolve, reject;
  pyReady = new Promise((a, b) => { resolve = a; reject = b; });

    const m = e.data;

  const hl = st || (waiting ? tr.steps[n - 1] : null);
  if (hl) dbgMark = markLine('dbg-line', hl.f, hl.l);

  const lineText = st && fileBy(st.f) && fileBy(st.f).doc ? fileBy(st.f).doc.getLine(st.l - 1).trim() : '';
  let ev;
  if (waiting) ev = `Line ${hl ? hl.l : '?'} is <span class="wait">waiting for input</span>`;
  else if (done) ev = tr.err ? `<span class="exc">Ended with an error</span>` : tr.limited ? `Stopped at ${STEP_LIMIT} steps, possible infinite loop` : 'Done';
  else if (st.ev === 'return') ev = `${esc(st.stack[st.stack.length - 1].split('  ·')[0])} <span class="ret">returned</span> ${esc(st.ret)}`;
  else if (st.ev === 'exception') ev = `Line ${st.l} <span class="exc">raised</span> ${esc(st.exc)}`;
  else ev = `Line ${st.l}: <b>${esc(lineText)}</b>`;
  $('eventLine').innerHTML = ev;

  const view = st || tr.steps[n - 1];
  $('stack').innerHTML = view ? view.stack.map((f, k) => (k ? '&nbsp;'.repeat(k * 2) + '↳ ' : '') + esc(f)).join('<br>') : '<span class="empty">empty</span>';

  const prev = st && idx > 0 ? tr.steps[idx - 1] : null;
  const prevMap = {};
  if (prev && prev.stack.length === st.stack.length) for (const [k, , v] of prev.vars) prevMap[k] = v;
  const vars = view ? view.vars : [];
  $('vars').innerHTML = vars.length
    ? vars.map(([k, t, v]) => `<tr class="${prev && prevMap[k] !== v ? 'changed' : ''}"><td class="name">${esc(k)}</td><td class="type">${esc(t)}</td><td class="val">${esc(v)}</td></tr>`).join('')
    : '<tr><td class="empty">No variables yet</td></tr>';

  const o = $('dbgOut');
  o.textContent = '';
  write(o, done ? tr.out : tr.out.slice(0, st.o), 'out');
  if (done && tr.err) { write(o, (tr.out && !tr.out.endsWith('\n') ? '\n' : '') + tr.err, 'err'); markErr(tr.loc); } else clearErrMark();
  if (waiting) askInline(o, $('dbgBody'), v => { dbg.inputs.push(v); dbg.resume = n; record(); });
  else if (!o.textContent) o.innerHTML = '<span class="empty">Nothing printed yet</span>';
}
function cont() {
  const bps = bpSet(), steps = dbg.trace.steps;
  for (let j = dbg.idx + 1; j < steps.length; j++) if (steps[j].ev === 'line' && bps.has(steps[j].f + ':' + steps[j].l)) return show(j);
  show(steps.length);
}
$('debugBtn').onclick = startDebug;
$('exitDbgBtn').onclick = () => { exitDebug(); status('Ready'); };
$('dbgStep').onclick = () => show(dbg.idx + 1);
$('dbgBack').onclick = () => show(dbg.idx - 1);
$('dbgRestart').onclick = () => show(0);
$('dbgCont').onclick = cont;
$('scrub').oninput = e => show(+e.target.value);
document.addEventListener('keydown', e => {
  if (!dbg || !dbg.trace || job || e.target.tagName === 'INPUT' || e.target.closest('.CodeMirror')) return;
  if (e.key === 'ArrowRight' || e.key === 'F10') { e.preventDefault(); show(dbg.idx + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); show(dbg.idx - 1); }
  else if (e.key === 'F8') { e.preventDefault(); cont(); }
  else if (e.key === 'Escape') exitDebug();
});

// ---------------- boot ----------------
(function boot() {
  let loaded = false;
  const saved = store.get(PROJECT_KEY);
  if (saved) {
    try {
      const p = deserialize(saved);
      if (p.files.length === 1 && p.files[0].doc && p.files[0].doc.getValue() === OLD_SAMPLE) p.files[0].doc.setValue(SAMPLE);
      setProject(p.files, p.active); loaded = true;
    } catch {}
  }
  if (!loaded) setProject([makeFile('main.py', store.get(OLD_DRAFT_KEY) || SAMPLE)], 'main.py');
  loadFromHash();
  for (const f of files) if (f.doc) f.doc.clearHistory();
  setExplorer(store.get(EXPLORER_KEY) === '1');
  startWorker();
})();
})();
</script>
</body>
